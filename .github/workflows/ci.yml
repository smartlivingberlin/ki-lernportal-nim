name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web install, build, lint and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.13.0

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail

          NODE_VERSION="$(node --version)"
          PNPM_VERSION="$(pnpm --version)"

          echo "NODE_VERSION=$NODE_VERSION"
          echo "PNPM_VERSION=$PNPM_VERSION"

          test "$NODE_VERSION" = "v22.22.1"
          test "$PNPM_VERSION" = "11.13.0"

          echo "PINNED_TOOLCHAIN=PASS"

      - name: GitHub governance policy check
        run: pnpm governance:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate S51A package boundaries
        run: pnpm packages:boundaries

      - name: Check Railway web vendor sync
        run: pnpm railway:web-vendor:check

      - name: Check Railway apps/web npm isolation contract
        run: pnpm railway:web-npm-isolation

      - name: Verify isolated Railway npm install pins
        run: pnpm railway:web-npm-isolation:install

      - name: Typecheck S51A packages
        run: pnpm packages:typecheck

      - name: Test S51C-B1A pilot domain vocabulary
        run: pnpm test:s51c-b1a-pilot-domain

      - name: Test S51C-B1B local progress import contracts
        run: pnpm test:s51c-b1b-local-progress-import

      - name: Test S51C-OPS-A operations foundation contracts
        run: pnpm test:s51c-ops-a-operations

      - name: Test S52-A auth session and role policy vocabulary
        run: pnpm test:s52-a-auth-policy

      - name: Test S52-B auth runtime foundation
        run: pnpm test:s52-b-auth-runtime

      - name: Test S52-D1 auth HTTP login/logout contracts
        run: pnpm test:s52-d1-auth-http

      - name: Test S52-C auth web boundary scope lock
        run: pnpm test:s52-c-auth-web-scope

      - name: Test S52-D auth web implementation scope lock
        run: pnpm test:s52-d-auth-web-impl-scope

      - name: Test S52-D2b staging AUTH_RUNTIME docs evidence
        run: pnpm test:s52-d2b-staging-auth-docs

      - name: Test S51B-B database runtime with local fakes
        run: pnpm test:s51b-b-db-runtime

      - name: Test S51B-B disposable local MySQL connection proof
        run: pnpm test:s51b-b-connection-proof

      - name: Test S51B-C1 pilot schema statically
        run: pnpm test:s51b-c1-pilot-schema

      - name: Test S51B-C2 disposable local MySQL
        run: pnpm test:s51b-c2-local-mysql

      - name: Supply-chain policy check
        run: pnpm supply-chain:check

      - name: Dependency vulnerability audit
        run: pnpm audit

      - name: Production dependency vulnerability audit
        run: pnpm audit --prod

      - name: Railway readiness policy check
        run: node scripts/check-s50d1-railway-readiness.mjs

      - name: S51D-B staging execution static contract
        run: node scripts/check-s51d-b-staging-static.mjs

      - name: Build web app and package standalone assets
        run: pnpm --filter web build

      - name: Verify standalone asset package
        run: pnpm --filter web verify:standalone-assets

      - name: Lint web app
        run: pnpm --filter web lint

      - name: Content quality check
        run: pnpm content:check

      - name: Portal clarity chrome contract
        run: pnpm test:portal-clarity

      - name: Packaging A Simple Mode / reset contract
        run: pnpm test:packaging-a

      - name: Next-step contract
        run: pnpm test:next-step-contract

      - name: Micro progress and Kernweg/Vertiefung contract
        run: pnpm test:micro-progress

      - name: Local progress backup and clarity contract
        run: pnpm test:progress-backup

      - name: Shareable lesson URL contract
        run: pnpm test:lesson-share-url

      - name: Planned Alltag/Prompting path bridges
        run: pnpm test:planned-paths

      - name: Kernweg completion panel contract
        run: pnpm test:kernweg-complete

      - name: Source and lesson integrity check
        run: pnpm source:check

      - name: Quellenparität Wegweiser static check
        run: pnpm test:quellenparitaet

      - name: Datenschutz localStorage key inventory
        run: pnpm test:datenschutz-storage-keys

      - name: Media M0/M1 open-source contract
        run: pnpm test:media-m0

      - name: Media M2 video pilot contract
        run: pnpm test:media-m2

      - name: Media M3 guide mascot contract
        run: pnpm test:media-m3

      - name: Media M4 audio pilot contract
        run: pnpm test:media-m4

      - name: Media M5-A mock tutor contract
        run: pnpm test:media-m5

      - name: Media M5-B local Ollama proof contract
        run: pnpm test:media-m5b

      - name: S56-A curated retrieval contract
        run: pnpm test:s56-a

      - name: S56-B staging flag privacy contract
        run: pnpm test:s56-b

      - name: S56-C curated retrieval UI contract
        run: pnpm test:s56-c

      - name: S56-C2 curated retrieval l2 expansion contract
        run: pnpm test:s56-c2

      - name: S56-C3 curated retrieval l3 expansion contract
        run: pnpm test:s56-c3

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_LOG="$RUNNER_TEMP/playwright-install.log"

          if ! pnpm exec playwright install --with-deps chromium > "$INSTALL_LOG" 2>&1; then
            cat "$INSTALL_LOG"
            exit 1
          fi

          echo "PLAYWRIGHT_RUNTIME_READY=YES"

      - name: Start local web server
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_TRACKING_ID="" nohup pnpm --filter web start > "$RUNNER_TEMP/ki-lernportal-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ki-lernportal-web.pid"

          READY=NO
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              READY=YES
              break
            fi
            sleep 1
          done

          if [ "$READY" != "YES" ]; then
            echo "Local web server did not become ready."
            tail -n 80 "$RUNNER_TEMP/ki-lernportal-web.log" || true
            exit 1
          fi

          echo "LOCAL_WEB_READY=YES"

      - name: "Regression: Railway health endpoint"
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="http://127.0.0.1:3000/health"
          HEALTH_HEADERS="$RUNNER_TEMP/railway-health.headers"
          HEALTH_BODY="$RUNNER_TEMP/railway-health.body"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output "$HEALTH_BODY" \
              --dump-header "$HEALTH_HEADERS" \
              --write-out "%{http_code}" \
              "$HEALTH_URL"
          )"

          BODY_TEXT="$(tr -d '\r\n' < "$HEALTH_BODY")"

          test "$HTTP_CODE" = "200"
          test "$BODY_TEXT" = "ok"

          tr -d '\r' < "$HEALTH_HEADERS" |
            grep --ignore-case --extended-regexp '^cache-control:.*no-store'

          tr -d '\r' < "$HEALTH_HEADERS" |
            grep --ignore-case --extended-regexp '^content-type: *text/plain; *charset=utf-8'

          echo "RAILWAY_HEALTH_ENDPOINT=PASS"

      - name: "Regression: mass-audience local monitor smoke"
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:mass-audience-monitor

      - name: "Regression: S51C-OPS-A live ready version endpoints"
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:3000"

          LIVE_BODY="$(curl --silent --show-error --fail "$BASE/live")"
          echo "$LIVE_BODY" | grep -F '"status":"live"'

          READY_BODY="$(curl --silent --show-error --fail "$BASE/ready")"
          echo "$READY_BODY" | grep -F '"status":"ready"'
          echo "$READY_BODY" | grep -F '"name":"database"'
          echo "$READY_BODY" | grep -F '"status":"not_configured"'

          VERSION_BODY="$(curl --silent --show-error --fail "$BASE/version")"
          echo "$VERSION_BODY" | grep -F '"service":"web"'
          echo "$VERSION_BODY" | grep -F '"version":"0.1.0"'
          echo "$VERSION_BODY" | grep -F '"environment":"concept_demo"'
          echo "$VERSION_BODY" | grep -F '"build_sha"'

          echo "S51C_OPS_A_ENDPOINTS=PASS"

      - name: "Regression: security headers"
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:s50d2-security-headers

      - name: "Regression: responsive, hydration and accessibility"
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:s48b-a11y

      - name: "Regression: privacy page mobile overflow"
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:s50d1-privacy-overflow

      - name: "Regression: approved sources for all lessons"
        run: BASE_URL=http://127.0.0.1:3000 pnpm test:s48c-sources

      - name: "Regression: practice engine across all lessons"
        shell: bash
        env:
          S49D_BASE_URL: http://127.0.0.1:3000
          S49D_ARTIFACT_DIR: ${{ runner.temp }}/s49d
        run: |
          set -euo pipefail

          AXE_PATH="$(
            node -p "const path=require('node:path'); require.resolve('axe-core/axe.min.js',{paths:[path.dirname(require.resolve('@axe-core/playwright'))]})"
          )"

          test -f "$AXE_PATH"
          mkdir -p "$S49D_ARTIFACT_DIR"

          S49D_AXE_PATH="$AXE_PATH" pnpm test:s49d-practice-ui

      - name: "Smoke: start state 0/12"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=start node scripts/check-local-progress.cjs

      - name: "Smoke: browser JavaScript assets"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=assets node scripts/check-local-progress.cjs

      - name: "Smoke: click updates progress to 1/12"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=click node scripts/check-local-progress.cjs

      - name: "Smoke: click persists lesson l1"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=storage node scripts/check-local-progress.cjs

      - name: "Smoke: module progress 1/3"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=module node scripts/check-local-progress.cjs

      - name: "Smoke: lesson done status"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=status node scripts/check-local-progress.cjs

      - name: "Smoke: reload local progress"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=reload node scripts/check-local-progress.cjs

      - name: "Smoke: undo progress"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=undo node scripts/check-local-progress.cjs

      - name: "Smoke: two lessons 2/12"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=two node scripts/check-local-progress.cjs

      - name: "Smoke: reset progress"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=reset node scripts/check-local-progress.cjs

      - name: "Smoke: cross-tab storage removal"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=cross-tab-clear node scripts/check-local-progress.cjs

      - name: "Smoke: private-demo UI guardrails"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=guardrails node scripts/check-local-progress.cjs

      - name: "Smoke: micro progress Vertiefung"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=micro-progress node scripts/check-local-progress.cjs

      - name: "Smoke: coach lesson backup export"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=coach-backup node scripts/check-local-progress.cjs

      - name: "Smoke: planned paths panel"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=planned-paths node scripts/check-local-progress.cjs

      - name: "Smoke: kernweg complete panel"
        run: BASE_URL=http://127.0.0.1:3000 SMOKE_PHASE=kernweg-complete node scripts/check-local-progress.cjs

      - name: Stop local web server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ki-lernportal-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ki-lernportal-web.pid")" 2>/dev/null || true
          fi
          echo "===== LOCAL WEB LOG ====="
          tail -n 80 "$RUNNER_TEMP/ki-lernportal-web.log" || true
