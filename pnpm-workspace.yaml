packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

overrides:
  "next>postcss": "8.5.26"
  "postcss": "8.5.26"
  "next>sharp": "0.35.3"
  "brace-expansion@1": "1.1.18"
  "brace-expansion@5": "5.0.9"
  "js-yaml@4": "4.3.1"
  "nanoid@3": "3.3.18"

nodeVersion: 22.22.1
engineStrict: true
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440

allowBuilds:
