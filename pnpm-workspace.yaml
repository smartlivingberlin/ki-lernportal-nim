packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

overrides:
  "next>postcss": "8.5.22"
  "next>sharp": "0.35.3"

auditConfig:
  ignoreGhsas:
    # DEV-ONLY: ESLint/minimatch; keine Production-Abhängigkeit.
    # Kein kompatibler brace-expansion-1.x-Fix verfügbar.
    # AUDIT_EXCEPTION_EXPIRES=2026-08-09
    - GHSA-mh99-v99m-4gvg

nodeVersion: 22.22.1
engineStrict: true
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440

allowBuilds:
  "sharp@0.35.3": false
  "unrs-resolver@1.12.2": false

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 5.0.7
  - js-yaml@4.3.0
